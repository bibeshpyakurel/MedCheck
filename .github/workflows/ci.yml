name: CI

# PRs into dev only: `dev` requires these checks and an up-to-date branch, so the merged commit was
# already verified. Vercel's production build of `dev` is the last gate (see promote-main.yml).
on:
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders only; no secrets are needed to lint, test or build.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # The demo flow (e2e/demo-flow.spec.ts) against the real Supabase project. Secrets can't be read
    # in a job-level `if`, so they come in through env and every step is gated on them: without the
    # secrets (e.g. pull requests from forks) the job passes with a notice and runs nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      # Optional: lets the test delete the anonymous users it creates (otherwise only their data).
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - id: gate
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping e2e: NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY secrets are not set."
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.gate.outputs.enabled == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          node-version: 24
          cache: npm
      - if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: npm ci
      - if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.gate.outputs.enabled == 'true' }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
